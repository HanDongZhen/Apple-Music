name = "mr-han-music-media"
main = "worker.ts"
compatibility_date = "2025-10-14"
workers_dev = false

[[r2_buckets]]
binding = "MUSIC"
bucket_name = "mr-han-music-private"

# Configure a route such as music.example.com/media/* in your Cloudflare account.
# Keep the bucket private. No public r2.dev access.
[vars]
APP_ORIGIN = "https://music.example.com"
ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# ACCESS_AUD must be set with: npx wrangler secret put ACCESS_AUD --config cloudflare/wrangler.toml
